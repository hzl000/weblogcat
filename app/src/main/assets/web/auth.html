<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>授权访问 · WebLogcat</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f5fa;color:#14253d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);background:#fff;border:1px solid #e3eaf4;border-radius:20px;padding:32px;box-shadow:0 12px 36px #14233c0b}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#315fdf;color:white}h1{font-size:24px;margin:30px 0 12px}p{color:#64748b;font-size:14px;line-height:1.7}label{display:block;font-size:14px;font-weight:600;margin:24px 0 8px}input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:13px 14px;font:inherit;letter-spacing:3px;background:transparent;color:inherit}input:focus{outline:2px solid #315fdf;outline-offset:1px}.status{min-height:24px;color:#52657d}.error{color:#bf2d43}button{width:100%;border:0;border-radius:10px;padding:14px;background:#315fdf;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:default}@media(prefers-color-scheme:dark){:root{background:#0c111b;color:#dbe6f6}.card{background:#121a28;border-color:#273247}p,.status{color:#a9b7cb}input{border-color:#52657d}}
</style></head><body><main class="card"><div class="brand"><span class="mark">W</span><span>WebLogcat</span></div><h1>授权访问日志</h1><p>打开手机上的 WebLogcat 首页，在下方输入“浏览器连接”中显示的六位验证码。</p><form id="authorize"><label for="code">访问验证码</label><input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="输入六位验证码" required><p id="status" class="status" role="status">验证码使用后失效，过期后会自动更新。</p><button id="submit" type="submit">授权访问</button></form></main>
<script>
'use strict';
const form=document.getElementById('authorize'),button=document.getElementById('submit'),status=document.getElementById('status'),code=document.getElementById('code');
function message(text,error=false){status.textContent=text;status.classList.toggle('error',error);}
form.onsubmit=async event=>{event.preventDefault();if(!/^[0-9]{6}$/.test(code.value)){message('请输入六位数字验证码。',true);return;}button.disabled=true;message('正在验证…');try{const response=await fetch('/authorize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code.value}),cache:'no-store'});if(!response.ok)throw new Error('无法验证，请检查服务是否运行。');const result=await response.json();if(result.status==='approved'){message('授权成功，正在打开日志…');location.replace('/?token='+encodeURIComponent(result.token));return;}message(result.status==='locked'?'错误次数过多，请查看手机提示后重试。':'验证码错误或已过期，请查看手机上的最新验证码。',true);code.value='';}catch(error){message(error.message,true);}finally{button.disabled=false;}};
if(new URLSearchParams(location.search).has('token'))message('访问链接已失效，请输入手机上的验证码。',true);
</script></body></html>
