name: Build APK and publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android 平台和构建工具
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5

      - name: 准备固定签名
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.WEBLOGCAT_SIGNING_KEYSTORE }}
          WEBLOGCAT_SIGNING_PASSWORD: ${{ secrets.WEBLOGCAT_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" && test -n "$WEBLOGCAT_SIGNING_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/weblogcat-signing.jks"
          chmod 600 "$RUNNER_TEMP/weblogcat-signing.jks"
          echo "WEBLOGCAT_SIGNING_FILE=$RUNNER_TEMP/weblogcat-signing.jks" >> "$GITHUB_ENV"

      - name: 测试并编译可安装的 APK
        env:
          WEBLOGCAT_SIGNING_PASSWORD: ${{ secrets.WEBLOGCAT_SIGNING_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: 验证 APK 签名
        env:
          WEBLOGCAT_SIGNING_PASSWORD: ${{ secrets.WEBLOGCAT_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          expected=$(keytool -exportcert -keystore "$WEBLOGCAT_SIGNING_FILE" -alias weblogcat -storepass:env WEBLOGCAT_SIGNING_PASSWORD | sha256sum | cut -d' ' -f1)
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$actual" && test "$expected" = "$actual"

      - name: 准备发布文件
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t versions < <(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)
          if [[ ${#versions[@]} -ne 1 ]]; then
            echo '无法唯一确定 versionName' >&2
            exit 1
          fi
          if [[ ! ${versions[0]} =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo 'versionName 不能用于发布标签' >&2
            exit 1
          fi
          tag="v${versions[0]}"
          git check-ref-format "refs/tags/${tag}"
          apk="weblogcat-${tag}-debug.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${apk}"
          (cd dist && sha256sum "${apk}" > SHA256SUMS.txt)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          cat > dist/RELEASE_NOTES.md <<NOTES
          自动构建的 Debug APK，可下载并安装。

          - 源码提交：${GITHUB_SHA}
          - 构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 使用固定签名构建 Debug APK；此前使用其他签名的版本需要先卸载（会清除应用数据）。
          - SHA256SUMS.txt 可用于校验 APK 完整性。
          NOTES

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" >/dev/null 2>dist/release-error.txt; then
            gh release upload "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --title "WebLogcat ${RELEASE_TAG} (Debug)" --notes-file dist/RELEASE_NOTES.md --prerelease=false
          elif grep -q '(HTTP 404)' dist/release-error.txt; then
            gh release create "$RELEASE_TAG" \
              dist/*.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "WebLogcat ${RELEASE_TAG} (Debug)" \
              --notes-file dist/RELEASE_NOTES.md
          else
            cat dist/release-error.txt >&2
            exit 1
          fi
