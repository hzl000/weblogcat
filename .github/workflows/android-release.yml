name: Build APK and publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android 平台和构建工具
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5

      - name: 测试并编译可安装的 APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: 准备发布文件
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          apk="weblogcat-${tag}-debug.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${apk}"
          (cd dist && sha256sum "${apk}" > SHA256SUMS.txt)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          cat > dist/RELEASE_NOTES.md <<NOTES
          自动构建的 Debug APK，可下载并安装。

          - 源码提交：${GITHUB_SHA}
          - 构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 使用 Android 默认调试签名，未配置正式发布签名。
          - 不同构建的调试签名可能不同；若无法覆盖安装，需要先卸载旧版本（会清除应用数据）。
          - SHA256SUMS.txt 可用于校验 APK 完整性。
          NOTES

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "WebLogcat ${RELEASE_TAG} (Debug)" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease
